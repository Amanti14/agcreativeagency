<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="A signature being drawn surrounded by design tools, color swatches and sparkles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.55" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C9DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5C9DFF"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.62" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.2" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
  </defs>

  <style>
    .sig { fill: none; stroke: url(#ink); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 7s ease-in-out infinite; }
    .sig-glow { fill: none; stroke: #FFC400; stroke-opacity: .45; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 7s ease-in-out infinite; filter: url(#soft); }
    .line2 { fill: none; stroke: url(#swoosh); stroke-width: 9; stroke-linecap: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw2 7s ease-in-out infinite; }
    @keyframes draw {
      0%   { stroke-dashoffset: 1; opacity: 1; }
      42%  { stroke-dashoffset: 0; opacity: 1; }
      86%  { stroke-dashoffset: 0; opacity: 1; }
      96%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 1; opacity: 0; }
    }
    @keyframes draw2 {
      0%, 40% { stroke-dashoffset: 1; opacity: 1; }
      58%  { stroke-dashoffset: 0; opacity: 1; }
      86%  { stroke-dashoffset: 0; opacity: 1; }
      96%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 1; opacity: 0; }
    }
    .ring  { transform-origin: 480px 480px; animation: spin 40s linear infinite; }
    .ring2 { transform-origin: 480px 480px; animation: spin 60s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .float1 { animation: bob 6s ease-in-out infinite; }
    .float2 { animation: bob 7.5s ease-in-out -2s infinite; }
    .float3 { animation: bob 5.5s ease-in-out -4s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    .tw1 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out -1.1s infinite; }
    .tw3 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out -2.2s infinite; }
    @keyframes twinkle { 0%,100% { transform: scale(.35); opacity: .25; } 50% { transform: scale(1); opacity: 1; } }
    .handle { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .sig, .sig-glow, .line2 { animation: none; stroke-dashoffset: 0; }
      .ring, .ring2, .float1, .float2, .float3, .tw1, .tw2, .tw3, .handle { animation: none; }
    }
  </style>

  <!-- canvas -->
  <rect width="960" height="960" fill="#0B0E14"/>
  <rect width="960" height="960" fill="url(#dots)"/>
  <rect width="960" height="960" fill="url(#glowBlue)"/>
  <rect width="960" height="960" fill="url(#glowGold)"/>

  <!-- orbit rings -->
  <g class="ring" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round">
    <circle cx="480" cy="480" r="400"/>
  </g>
  <g class="ring2" fill="none" stroke="#5C9DFF" stroke-opacity=".35" stroke-width="2" stroke-dasharray="90 40 6 40">
    <circle cx="480" cy="480" r="330"/>
  </g>

  <!-- bezier curve being edited (top right) -->
  <g class="float2">
    <path d="M610 250 C 690 150, 800 150, 850 260" fill="none" stroke="#5C9DFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="610" y1="250" x2="660" y2="170" stroke="#5C9DFF" stroke-opacity=".6" stroke-width="2"/>
    <line x1="850" y1="260" x2="800" y2="170" stroke="#5C9DFF" stroke-opacity=".6" stroke-width="2"/>
    <rect x="601" y="241" width="18" height="18" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/>
    <rect x="841" y="251" width="18" height="18" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/>
    <circle class="handle" cx="660" cy="170" r="9" fill="#5C9DFF"/>
    <circle class="handle" cx="800" cy="170" r="9" fill="#5C9DFF"/>
  </g>

  <!-- color swatches (top left) -->
  <g class="float1">
    <circle cx="150" cy="190" r="46" fill="#FFC400"/>
    <circle cx="228" cy="150" r="34" fill="#5C9DFF"/>
    <circle cx="272" cy="226" r="26" fill="#F5F7FA"/>
    <circle cx="150" cy="190" r="46" fill="none" stroke="#0B0E14" stroke-opacity=".25" stroke-width="3"/>
  </g>

  <!-- pen nib (bottom left) -->
  <g transform="translate(160 765) rotate(-35)"><g class="float3">
    <path d="M0 -90 C 34 -52 44 -10 30 40 L0 74 L-30 40 C -44 -10 -34 -52 0 -90Z" fill="#F5F7FA"/>
    <path d="M0 -90 C 34 -52 44 -10 30 40 L0 74 L-30 40 C -44 -10 -34 -52 0 -90Z" fill="none" stroke="#FFC400" stroke-width="3"/>
    <line x1="0" y1="-26" x2="0" y2="58" stroke="#0B0E14" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="10" fill="#0B0E14"/>
    <rect x="-34" y="46" width="68" height="20" rx="10" fill="#FFC400"/>
  </g></g>

  <!-- the signature -->
  <path class="sig-glow" pathLength="1"
        d="M190 600 C 245 420, 305 270, 350 360 C 395 450, 255 650, 335 650 C 425 650, 445 405, 510 410 C 575 415, 480 610, 555 600 C 625 590, 650 450, 705 462 C 760 474, 700 590, 775 560 C 815 543, 815 495, 790 480"/>
  <path class="sig" pathLength="1"
        d="M190 600 C 245 420, 305 270, 350 360 C 395 450, 255 650, 335 650 C 425 650, 445 405, 510 410 C 575 415, 480 610, 555 600 C 625 590, 650 450, 705 462 C 760 474, 700 590, 775 560 C 815 543, 815 495, 790 480"/>
  <path class="line2" pathLength="1" d="M215 722 C 400 672, 640 760, 800 668"/>

  <!-- sparkles -->
  <g fill="#FFE38A">
    <g transform="translate(770 380) scale(.9)"><use href="#spark" class="tw1"/></g>
    <g transform="translate(130 470) scale(.6)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
    <g transform="translate(560 130) scale(.55)" fill="#5C9DFF"><use href="#spark" class="tw3"/></g>
    <g transform="translate(830 780) scale(.7)"><use href="#spark" class="tw2"/></g>
    <g transform="translate(420 820) scale(.45)" fill="#F5F7FA"><use href="#spark" class="tw1"/></g>
  </g>

  <!-- caption -->
  <text x="480" y="880" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="9" fill="#F5F7FA" fill-opacity=".55">SIGN YOUR MOVE</text>
</svg>
