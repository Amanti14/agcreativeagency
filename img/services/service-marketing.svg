<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Growth chart and megaphone for marketing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><rect x="210" y="190" width="540" height="480" rx="40" fill="#141923" stroke="#F5F7FA" stroke-opacity=".2" stroke-width="3"/>
<rect x="270" y="500" width="64" height="110" rx="12" fill="#5C9DFF"/><rect x="370" y="440" width="64" height="170" rx="12" fill="#5C9DFF"/><rect x="470" y="370" width="64" height="240" rx="12" fill="#FFE38A"/><rect x="570" y="290" width="64" height="320" rx="12" fill="#FFC400"/>
<path d="M255 440 L400 360 L500 300 L650 215" fill="none" stroke="#F5F7FA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 205 L664 210 L650 262" fill="none" stroke="#F5F7FA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="bob2" transform="translate(690 700) rotate(-15)"><path d="M0 -40 L110 -90 V90 L0 40Z" fill="#FFC400"/><rect x="-50" y="-42" width="56" height="84" rx="16" fill="#F5F7FA"/><g fill="none" stroke="#5C9DFF" stroke-width="8" stroke-linecap="round"><path d="M135 -30 q30 30 0 60"/><path d="M160 -60 q55 60 0 120" stroke-opacity=".6"/></g></g>
<g class="bob2"><circle cx="190" cy="760" r="54" fill="#141923" stroke="#5C9DFF" stroke-width="4"/><path d="M190 790 C 150 760, 160 725, 190 735 C 220 725, 230 760, 190 790Z" fill="#FFC400"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>