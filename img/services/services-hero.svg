<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="Signature, color swatches and design tools representing AutoGraph Creative Agency services" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.6" cy="0.7" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="800" height="1200" fill="#0B0E14"/><rect width="800" height="1200" fill="url(#dots)"/>
<rect width="800" height="1200" fill="url(#gb)"/><rect width="800" height="1200" fill="url(#gg)"/>

<g class="spin"><circle cx="400" cy="560" r="330" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob2"><path d="M150 200 C 250 90, 380 90, 440 210" fill="none" stroke="#5C9DFF" stroke-width="5" stroke-linecap="round"/><line x1="150" y1="200" x2="195" y2="120" stroke="#5C9DFF" stroke-opacity=".6" stroke-width="2"/><line x1="440" y1="210" x2="395" y2="125" stroke="#5C9DFF" stroke-opacity=".6" stroke-width="2"/><rect x="140" y="190" width="20" height="20" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><rect x="430" y="200" width="20" height="20" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><circle cx="195" cy="120" r="10" fill="#5C9DFF"/><circle cx="395" cy="125" r="10" fill="#5C9DFF"/></g>
<g class="bob"><circle cx="600" cy="230" r="58" fill="#FFC400"/><circle cx="520" cy="300" r="38" fill="#5C9DFF"/><circle cx="660" cy="320" r="28" fill="#F5F7FA"/></g>
<path d="M120 800 C 190 600, 250 440, 300 520 C 350 600, 210 840, 295 840 C 395 840, 415 590, 485 595 C 555 600, 450 810, 530 800 C 605 790, 635 640, 690 655 C 745 670, 685 785, 745 760" fill="none" stroke="#FFC400" stroke-opacity=".4" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" style="filter:blur(10px)"/>
<path d="M120 800 C 190 600, 250 440, 300 520 C 350 600, 210 840, 295 840 C 395 840, 415 590, 485 595 C 555 600, 450 810, 530 800 C 605 790, 635 640, 690 655 C 745 670, 685 785, 745 760" fill="none" stroke="url(#ink)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M140 930 C 340 880, 560 970, 700 880" fill="none" stroke="#5C9DFF" stroke-width="9" stroke-linecap="round"/>
<g class="bob2" transform="translate(125 1000) rotate(-30)"><path d="M0 -90 C 34 -52 44 -10 30 40 L0 74 L-30 40 C -44 -10 -34 -52 0 -90Z" fill="#F5F7FA" stroke="#FFC400" stroke-width="3"/><line x1="0" y1="-26" x2="0" y2="58" stroke="#0B0E14" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-22" r="10" fill="#0B0E14"/><rect x="-34" y="46" width="68" height="20" rx="10" fill="#FFC400"/></g>
<g transform="translate(650 470) scale(0.9)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(110 420) scale(0.6)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g><g transform="translate(700 1010) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(400 1120) scale(0.5)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(250 300) scale(0.45)" fill="#FFE38A"><use href="#spark" class="tw"/></g>
<text x="400" y="1140" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="9" fill="#F5F7FA" fill-opacity=".55">AUTOGRAPH CREATIVE AGENCY</text>

</svg>