<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Logo tile with color palette" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><rect x="290" y="210" width="380" height="380" rx="56" fill="#141923" stroke="#F5F7FA" stroke-opacity=".25" stroke-width="3"/>
<path pathLength="1" d="M350 500 C 385 390, 420 300, 445 350 C 470 400, 395 520, 440 520 C 495 520, 505 380, 545 385 C 585 390, 525 500, 570 495 C 600 490, 610 430, 625 420" fill="none" stroke="url(#ink)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M345 548 C 440 520, 560 570, 625 530" fill="none" stroke="#5C9DFF" stroke-width="7" stroke-linecap="round"/></g>
<g class="bob2"><circle cx="330" cy="700" r="46" fill="#FFC400"/><circle cx="440" cy="700" r="46" fill="#5C9DFF"/><circle cx="550" cy="700" r="46" fill="#F5F7FA"/><circle cx="660" cy="700" r="46" fill="#141923" stroke="#F5F7FA" stroke-width="4"/></g>
<g><path d="M700 230 C 780 160, 840 200, 850 290" fill="none" stroke="#5C9DFF" stroke-width="4"/><line x1="700" y1="230" x2="740" y2="170" stroke="#5C9DFF" stroke-opacity=".6" stroke-width="2"/><rect x="691" y="221" width="18" height="18" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><circle cx="740" cy="170" r="9" fill="#5C9DFF"/><rect x="841" y="281" width="18" height="18" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>