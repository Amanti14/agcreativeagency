<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Printer, paper stack and stationery for the copy shop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><rect x="270" y="170" width="300" height="190" rx="14" fill="#F5F7FA"/><rect x="300" y="200" width="240" height="12" rx="6" fill="#2A3342"/><rect x="300" y="228" width="180" height="12" rx="6" fill="#2A3342"/><rect x="300" y="256" width="210" height="12" rx="6" fill="#2A3342"/>
<rect x="170" y="340" width="500" height="260" rx="40" fill="#141923" stroke="#F5F7FA" stroke-opacity=".3" stroke-width="4"/>
<rect x="210" y="390" width="420" height="22" rx="11" fill="#0B0E14"/><circle cx="590" cy="470" r="14" fill="#FFC400"/><circle cx="550" cy="470" r="14" fill="#5C9DFF"/><rect x="210" y="450" width="190" height="38" rx="19" fill="#2A3342"/>
<rect x="250" y="560" width="340" height="190" rx="12" fill="#F5F7FA"/><rect x="280" y="595" width="200" height="12" rx="6" fill="#2A3342"/><rect x="280" y="625" width="260" height="12" rx="6" fill="#2A3342"/><rect x="280" y="655" width="150" height="12" rx="6" fill="#2A3342"/><rect x="460" y="690" width="90" height="34" rx="17" fill="#FFC400"/></g>
<g class="bob2"><rect x="705" y="470" width="160" height="230" rx="24" fill="#5C9DFF"/><rect x="705" y="470" width="160" height="62" rx="24" fill="#FFE38A"/>
<g transform="translate(740 470)"><rect x="-6" y="-120" width="22" height="140" rx="8" fill="#FFC400" transform="rotate(-10)"/><rect x="26" y="-150" width="22" height="170" rx="8" fill="#F5F7FA" transform="rotate(8)"/><rect x="58" y="-110" width="22" height="130" rx="8" fill="#FFE38A" transform="rotate(22)"/></g></g>
<g class="bob2"><rect x="120" y="650" width="150" height="190" rx="14" fill="#141923" stroke="#FFC400" stroke-width="5"/><rect x="146" y="690" width="98" height="12" rx="6" fill="#F5F7FA" fill-opacity=".7"/><rect x="146" y="720" width="70" height="12" rx="6" fill="#F5F7FA" fill-opacity=".4"/><circle cx="170" cy="640" r="12" fill="#FFC400"/><circle cx="200" cy="640" r="12" fill="#FFC400"/><circle cx="230" cy="640" r="12" fill="#FFC400"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(850 330) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(800 820) scale(0.6)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(500 880) scale(0.4)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>