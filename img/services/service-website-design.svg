<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Browser window showing a website design" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><rect x="150" y="200" width="660" height="500" rx="34" fill="#141923" stroke="#F5F7FA" stroke-opacity=".25" stroke-width="3"/>
<path d="M150 234 a34 34 0 0 1 34 -34 H776 a34 34 0 0 1 34 34 V268 H150Z" fill="#2A3342"/>
<circle cx="190" cy="234" r="9" fill="#FF6B6B"/><circle cx="222" cy="234" r="9" fill="#FFC400"/><circle cx="254" cy="234" r="9" fill="#5BD08A"/>
<rect x="310" y="222" width="360" height="24" rx="12" fill="#0B0E14" fill-opacity=".7"/>
<rect x="190" y="310" width="300" height="26" rx="13" fill="#F5F7FA"/><rect x="190" y="356" width="240" height="16" rx="8" fill="#F5F7FA" fill-opacity=".4"/><rect x="190" y="388" width="200" height="16" rx="8" fill="#F5F7FA" fill-opacity=".25"/>
<rect x="190" y="430" width="130" height="46" rx="23" fill="#FFC400"/>
<rect x="530" y="310" width="240" height="190" rx="22" fill="#5C9DFF" fill-opacity=".85"/><circle cx="650" cy="380" r="34" fill="#F5F7FA" fill-opacity=".9"/><path d="M560 470 L620 420 L670 460 L720 410 L770 470Z" fill="#0B0E14" fill-opacity=".45"/>
<rect x="190" y="540" width="180" height="120" rx="18" fill="#2A3342"/><rect x="390" y="540" width="180" height="120" rx="18" fill="#2A3342"/><rect x="590" y="540" width="180" height="120" rx="18" fill="#2A3342"/>
<circle cx="230" cy="580" r="14" fill="#FFC400"/><circle cx="430" cy="580" r="14" fill="#5C9DFF"/><circle cx="630" cy="580" r="14" fill="#F5F7FA"/></g>
<g class="bob2" transform="translate(690 640)"><path d="M0 0 L0 120 L34 90 L60 146 L88 134 L62 80 L108 78Z" fill="#F5F7FA" stroke="#0B0E14" stroke-width="6" stroke-linejoin="round"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>