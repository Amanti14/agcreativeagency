<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Brand guide document with colors and rules" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob2" transform="rotate(8 560 480)"><rect x="410" y="190" width="330" height="460" rx="28" fill="#141923" stroke="#2A3342" stroke-width="4"/></g>
<g class="bob" transform="rotate(-6 400 480)"><rect x="230" y="220" width="340" height="470" rx="28" fill="#141923" stroke="#F5F7FA" stroke-opacity=".3" stroke-width="4"/>
<rect x="268" y="262" width="110" height="110" rx="22" fill="#FFC400"/><path d="M290 340 C 305 300, 320 285, 330 300 C 340 315, 308 350, 325 350 C 350 350, 352 305, 362 308" fill="none" stroke="#0B0E14" stroke-width="7" stroke-linecap="round"/>
<rect x="268" y="400" width="250" height="14" rx="7" fill="#F5F7FA" fill-opacity=".7"/><rect x="268" y="430" width="200" height="12" rx="6" fill="#F5F7FA" fill-opacity=".35"/>
<circle cx="290" cy="520" r="24" fill="#FFC400"/><circle cx="350" cy="520" r="24" fill="#5C9DFF"/><circle cx="410" cy="520" r="24" fill="#F5F7FA"/><circle cx="470" cy="520" r="24" fill="#2A3342"/>
<rect x="268" y="574" width="250" height="12" rx="6" fill="#F5F7FA" fill-opacity=".3"/><rect x="268" y="604" width="170" height="12" rx="6" fill="#F5F7FA" fill-opacity=".2"/></g>
<g stroke="#5C9DFF" stroke-width="3" stroke-opacity=".7"><line x1="170" y1="170" x2="170" y2="760"/><line x1="150" y1="200" x2="190" y2="200"/><line x1="150" y1="500" x2="190" y2="500"/><line x1="150" y1="730" x2="190" y2="730"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>