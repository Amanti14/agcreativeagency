<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Website and Telegram Mini App management" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><rect x="130" y="230" width="500" height="380" rx="30" fill="#141923" stroke="#F5F7FA" stroke-opacity=".25" stroke-width="3"/>
<path d="M130 262 a30 30 0 0 1 30 -30 H600 a30 30 0 0 1 30 30 V290 H130Z" fill="#2A3342"/><circle cx="168" cy="261" r="8" fill="#FF6B6B"/><circle cx="196" cy="261" r="8" fill="#FFC400"/><circle cx="224" cy="261" r="8" fill="#5BD08A"/>
<rect x="170" y="330" width="260" height="22" rx="11" fill="#F5F7FA"/><rect x="170" y="372" width="200" height="14" rx="7" fill="#F5F7FA" fill-opacity=".35"/>
<rect x="170" y="430" width="120" height="120" rx="16" fill="#2A3342"/><rect x="310" y="430" width="120" height="120" rx="16" fill="#2A3342"/><rect x="450" y="330" width="140" height="220" rx="16" fill="#5C9DFF" fill-opacity=".75"/></g>
<g class="bob2"><rect x="560" y="330" width="250" height="450" rx="44" fill="#0B0E14" stroke="#F5F7FA" stroke-width="6"/><rect x="600" y="360" width="170" height="14" rx="7" fill="#F5F7FA" fill-opacity=".25"/>
<rect x="590" y="400" width="80" height="80" rx="20" fill="#FFC400"/><rect x="700" y="400" width="80" height="80" rx="20" fill="#5C9DFF"/><rect x="590" y="510" width="80" height="80" rx="20" fill="#F5F7FA"/><rect x="700" y="510" width="80" height="80" rx="20" fill="#2A3342"/>
<rect x="590" y="620" width="190" height="64" rx="32" fill="#FFC400"/><path d="M650 652 L675 668 L725 636" fill="none" stroke="#0B0E14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(250 740)"><g class="spin"><circle r="58" fill="none" stroke="#FFC400" stroke-width="26"/><g fill="#FFC400"><rect x="-14" y="-92" width="28" height="36" rx="6"/><rect x="-14" y="56" width="28" height="36" rx="6"/><rect x="-92" y="-14" width="36" height="28" rx="6"/><rect x="56" y="-14" width="36" height="28" rx="6"/><rect x="-14" y="-92" width="28" height="36" rx="6" transform="rotate(45)"/><rect x="-14" y="56" width="28" height="36" rx="6" transform="rotate(45)"/><rect x="-92" y="-14" width="36" height="28" rx="6" transform="rotate(45)"/><rect x="56" y="-14" width="36" height="28" rx="6" transform="rotate(45)"/></g></g><circle r="18" fill="#0B0E14"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(560 170) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(860 260) scale(0.6)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(110 520) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>