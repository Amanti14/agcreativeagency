<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Shapes, pen tool and curves for graphic design" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><circle cx="400" cy="400" r="150" fill="#FFC400"/><rect x="380" y="380" width="260" height="260" rx="30" fill="none" stroke="#5C9DFF" stroke-width="12" transform="rotate(12 510 510)"/><path d="M470 640 L590 440 L710 640Z" fill="#F5F7FA" fill-opacity=".92"/></g>
<g><path d="M200 700 C 290 560, 420 780, 560 690" fill="none" stroke="#FFE38A" stroke-width="6" stroke-linecap="round"/>
<line x1="200" y1="700" x2="250" y2="640" stroke="#5C9DFF" stroke-opacity=".7" stroke-width="2"/><line x1="560" y1="690" x2="610" y2="740" stroke="#5C9DFF" stroke-opacity=".7" stroke-width="2"/>
<rect x="191" y="691" width="18" height="18" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><rect x="551" y="681" width="18" height="18" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><circle cx="250" cy="640" r="9" fill="#5C9DFF"/><circle cx="610" cy="740" r="9" fill="#5C9DFF"/></g>
<g class="bob2" transform="translate(745 255) rotate(25)"><path d="M0 -90 C 34 -52 44 -10 30 40 L0 74 L-30 40 C -44 -10 -34 -52 0 -90Z" fill="#F5F7FA" stroke="#FFC400" stroke-width="4"/><line x1="0" y1="-26" x2="0" y2="58" stroke="#0B0E14" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-22" r="10" fill="#0B0E14"/><rect x="-34" y="46" width="68" height="20" rx="10" fill="#FFC400"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>