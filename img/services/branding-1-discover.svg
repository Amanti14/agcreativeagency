<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Magnifying glass discovering a brand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><circle cx="440" cy="440" r="150" fill="#141923" stroke="#FFC400" stroke-width="24"/>
<circle cx="440" cy="440" r="95" fill="none" stroke="#5C9DFF" stroke-width="5" stroke-opacity=".7"/>
<circle cx="440" cy="440" r="48" fill="none" stroke="#5C9DFF" stroke-width="5"/>
<circle cx="440" cy="440" r="12" fill="#FFE38A"/>
<line x1="440" y1="270" x2="440" y2="320" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round"/><line x1="440" y1="560" x2="440" y2="610" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round"/>
<line x1="270" y1="440" x2="320" y2="440" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round"/><line x1="560" y1="440" x2="610" y2="440" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round"/>
<line x1="555" y1="555" x2="700" y2="700" stroke="#F5F7FA" stroke-width="42" stroke-linecap="round"/>
<line x1="555" y1="555" x2="610" y2="610" stroke="#FFC400" stroke-width="42" stroke-linecap="round"/></g>
<g class="bob2"><rect x="640" y="190" width="170" height="64" rx="32" fill="#141923" stroke="#5C9DFF" stroke-width="3"/><circle cx="676" cy="222" r="12" fill="#5C9DFF"/><rect x="700" y="214" width="82" height="9" rx="4.5" fill="#F5F7FA" fill-opacity=".6"/><rect x="700" y="230" width="52" height="8" rx="4" fill="#F5F7FA" fill-opacity=".3"/></g>
<g class="bob2"><rect x="140" y="640" width="170" height="64" rx="32" fill="#141923" stroke="#FFC400" stroke-width="3"/><circle cx="176" cy="672" r="12" fill="#FFC400"/><rect x="200" y="664" width="82" height="9" rx="4.5" fill="#F5F7FA" fill-opacity=".6"/><rect x="200" y="680" width="52" height="8" rx="4" fill="#F5F7FA" fill-opacity=".3"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>