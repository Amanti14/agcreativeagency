<rect x="360" y="160" width="160" height="56" rx="28" fill="#FFC400"/><rect x="410" y="176" width="60" height="24" rx="12" fill="#0B0E14"/>
<g fill="none" stroke="#FFC400" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M285 330 l22 22 l40 -44"/><path d="M285 450 l22 22 l40 -44"/><path d="M285 570 l22 22 l40 -44"/></g>
<rect x="390" y="316" width="200" height="16" rx="8" fill="#F5F7FA" fill-opacity=".8"/><rect x="390" y="346" width="140" height="12" rx="6" fill="#F5F7FA" fill-opacity=".35"/>
<rect x="390" y="436" width="170" height="16" rx="8" fill="#F5F7FA" fill-opacity=".8"/><rect x="390" y="466" width="120" height="12" rx="6" fill="#F5F7FA" fill-opacity=".35"/>
<rect x="390" y="556" width="190" height="16" rx="8" fill="#F5F7FA" fill-opacity=".8"/><rect x="390" y="586" width="100" height="12" rx="6" fill="#F5F7FA" fill-opacity=".35"/>
<circle cx="285" cy="670" r="14" fill="none" stroke="#5C9DFF" stroke-width="5"/><rect x="390" y="662" width="150" height="14" rx="7" fill="#F5F7FA" fill-opacity=".3"/></g>
<g transform="translate(690 520) rotate(38)"><g class="bob2"><rect x="-26" y="-210" width="52" height="320" rx="10" fill="#FFC400"/><rect x="-26" y="-210" width="52" height="58" rx="10" fill="#FFE38A"/><path d="M-26 110 L0 180 L26 110Z" fill="#F5F7FA"/><path d="M-9 152 L0 180 L9 152Z" fill="#0B0E14"/></g></g>
