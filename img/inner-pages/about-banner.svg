<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" role="img" aria-label="Autograph Creative Agency banner with design tools around the agency signature" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.12" cy="0.1" r="0.55"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.30"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.85" cy="0.95" r="0.55"><stop offset="0" stop-color="#FFC400" stop-opacity="0.24"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<radialGradient id="gc" cx="0.5" cy="0.5" r="0.4"><stop offset="0" stop-color="#FFC400" stop-opacity="0.12"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}.bob3{animation:bob 5.5s ease-in-out -4s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.spin2{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 5s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleY(.88)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.bob3,.tw,.tw2,.spin,.spin2,.bar{animation:none}}
</style>
<rect width="1920" height="960" fill="#0B0E14"/><rect width="1920" height="960" fill="url(#dots)"/>
<rect width="1920" height="960" fill="url(#gb)"/><rect width="1920" height="960" fill="url(#gg)"/><rect width="1920" height="960" fill="url(#gc)"/>
<g class="spin"><circle cx="960" cy="480" r="400" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="spin2"><circle cx="960" cy="480" r="330" fill="none" stroke="#5C9DFF" stroke-opacity=".32" stroke-width="2" stroke-dasharray="90 40 6 40"/></g>

<!-- LEFT: color + pen tool -->
<g class="bob"><circle cx="220" cy="230" r="70" fill="#FFC400"/><circle cx="340" cy="170" r="50" fill="#5C9DFF"/><circle cx="395" cy="285" r="36" fill="#F5F7FA"/></g>
<g class="bob2"><path d="M150 650 C 250 520, 400 760, 560 640" fill="none" stroke="#FFE38A" stroke-width="6" stroke-linecap="round"/>
<line x1="150" y1="650" x2="205" y2="585" stroke="#5C9DFF" stroke-opacity=".7" stroke-width="2"/><line x1="560" y1="640" x2="610" y2="700" stroke="#5C9DFF" stroke-opacity=".7" stroke-width="2"/>
<rect x="140" y="640" width="20" height="20" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><rect x="550" y="630" width="20" height="20" fill="#0B0E14" stroke="#F5F7FA" stroke-width="3"/><circle cx="205" cy="585" r="10" fill="#5C9DFF"/><circle cx="610" cy="700" r="10" fill="#5C9DFF"/></g>
<g transform="translate(470 420) rotate(-35)"><g class="bob3"><path d="M0 -90 C 34 -52 44 -10 30 40 L0 74 L-30 40 C -44 -10 -34 -52 0 -90Z" fill="#F5F7FA" stroke="#FFC400" stroke-width="4"/><line x1="0" y1="-26" x2="0" y2="58" stroke="#0B0E14" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-22" r="10" fill="#0B0E14"/><rect x="-34" y="46" width="68" height="20" rx="10" fill="#FFC400"/></g></g>

<!-- RIGHT: web + growth -->
<g class="bob2"><rect x="1380" y="150" width="400" height="290" rx="26" fill="#141923" stroke="#F5F7FA" stroke-opacity=".25" stroke-width="3"/>
<path d="M1380 176 a26 26 0 0 1 26 -26 H1754 a26 26 0 0 1 26 26 V200 H1380Z" fill="#2A3342"/><circle cx="1410" cy="175" r="7" fill="#FF6B6B"/><circle cx="1434" cy="175" r="7" fill="#FFC400"/><circle cx="1458" cy="175" r="7" fill="#5BD08A"/>
<rect x="1410" y="230" width="170" height="20" rx="10" fill="#F5F7FA"/><rect x="1410" y="266" width="130" height="12" rx="6" fill="#F5F7FA" fill-opacity=".4"/><rect x="1410" y="300" width="90" height="34" rx="17" fill="#FFC400"/>
<rect x="1610" y="226" width="140" height="120" rx="16" fill="#5C9DFF" fill-opacity=".85"/><circle cx="1680" cy="270" r="20" fill="#F5F7FA" fill-opacity=".9"/>
<rect x="1410" y="360" width="100" height="56" rx="12" fill="#2A3342"/><rect x="1530" y="360" width="100" height="56" rx="12" fill="#2A3342"/><rect x="1650" y="360" width="100" height="56" rx="12" fill="#2A3342"/></g>
<g class="bob3"><rect x="1250" y="560" width="480" height="270" rx="30" fill="#141923" stroke="#F5F7FA" stroke-opacity=".2" stroke-width="3"/>
<rect class="bar" x="1300" y="710" width="52" height="80" rx="10" fill="#5C9DFF"/><rect class="bar" x="1380" y="670" width="52" height="120" rx="10" fill="#5C9DFF"/><rect class="bar" x="1460" y="630" width="52" height="160" rx="10" fill="#FFE38A"/><rect class="bar" x="1540" y="595" width="52" height="195" rx="10" fill="#FFC400"/>
<path d="M1300 680 L1405 630 L1485 600 L1640 570" fill="none" stroke="#F5F7FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M1600 565 L1646 568 L1636 610" fill="none" stroke="#F5F7FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(1782 700) rotate(-15)"><g class="bob"><path d="M0 -34 L82 -72 V72 L0 34Z" fill="#FFC400"/><rect x="78" y="-82" width="20" height="164" rx="10" fill="#FFE38A"/><rect x="-42" y="-36" width="48" height="72" rx="14" fill="#F5F7FA"/></g></g>

<g transform="translate(760 150) scale(0.9)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(1160 820) scale(0.7)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g><g transform="translate(120 860) scale(0.6)" fill="#5C9DFF"><use href="#spark" class="tw"/></g><g transform="translate(1840 110) scale(0.55)" fill="#FFE38A"><use href="#spark" class="tw2"/></g><g transform="translate(640 880) scale(0.5)" fill="#FFE38A"><use href="#spark" class="tw2"/></g><g transform="translate(1230 100) scale(0.45)" fill="#5C9DFF"><use href="#spark" class="tw"/></g><g transform="translate(90 470) scale(0.5)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>