<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="A path from a simple idea to a finished brand: lightbulb, pen nib, logo and website" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.15" cy="0.85" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<radialGradient id="gc" cx="0.85" cy="0.12" r="0.6"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.30"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}.bob3{animation:bob 5.5s ease-in-out -4s infinite}.bob4{animation:bob 6.8s ease-in-out -1s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.dash{animation:dash 3s linear infinite}@keyframes dash{to{stroke-dashoffset:-60}}
.glow{animation:glow 3s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.bob3,.bob4,.tw,.tw2,.dash,.glow{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/><rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gc)"/>

<!-- the path -->
<path class="dash" d="M190 760 C 190 620, 350 700, 350 560 C 350 430, 600 610, 600 470 C 600 350, 790 400, 770 250" fill="none" stroke="#FFC400" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 26" stroke-opacity=".8"/>

<!-- 1 idea: lightbulb -->
<g class="bob"><circle class="glow" cx="190" cy="740" r="110" fill="#FFC400" fill-opacity=".18"/>
<path d="M190 680 a62 62 0 0 1 38 111 v26 h-76 v-26 a62 62 0 0 1 38 -111Z" fill="#FFC400"/>
<rect x="156" y="826" width="68" height="14" rx="7" fill="#F5F7FA"/><rect x="166" y="848" width="48" height="12" rx="6" fill="#F5F7FA" fill-opacity=".7"/>
<path d="M170 760 q20 -26 40 0 M190 735 v30" fill="none" stroke="#0B0E14" stroke-width="6" stroke-linecap="round" stroke-opacity=".55"/></g>

<!-- 2 design: pen nib -->
<g transform="translate(350 540) rotate(-28)"><g class="bob2"><path d="M0 -100 C 38 -58 49 -11 34 45 L0 82 L-34 45 C -49 -11 -38 -58 0 -100Z" fill="#F5F7FA" stroke="#FFC400" stroke-width="4"/><line x1="0" y1="-30" x2="0" y2="64" stroke="#0B0E14" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="-25" r="11" fill="#0B0E14"/><rect x="-38" y="52" width="76" height="22" rx="11" fill="#FFC400"/></g></g>

<!-- 3 brand: logo tile -->
<g class="bob3"><rect x="500" y="370" width="200" height="200" rx="38" fill="#141923" stroke="#F5F7FA" stroke-opacity=".3" stroke-width="3"/>
<path d="M535 520 C 555 450, 575 400, 590 430 C 605 460, 560 530, 585 530 C 612 530, 618 450, 638 452 C 658 454, 628 520, 650 518 C 664 516, 668 490, 676 484" fill="none" stroke="url(#ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="535" cy="600" r="16" fill="#FFC400"/><circle cx="574" cy="600" r="16" fill="#5C9DFF"/><circle cx="613" cy="600" r="16" fill="#F5F7FA"/></g>

<!-- 4 launch: website -->
<g class="bob4"><rect x="630" y="130" width="270" height="200" rx="24" fill="#141923" stroke="#F5F7FA" stroke-opacity=".25" stroke-width="3"/>
<path d="M630 156 a24 24 0 0 1 24 -24 H876 a24 24 0 0 1 24 24 V176 H630Z" fill="#2A3342"/><circle cx="656" cy="154" r="6" fill="#FF6B6B"/><circle cx="676" cy="154" r="6" fill="#FFC400"/><circle cx="696" cy="154" r="6" fill="#5BD08A"/>
<rect x="658" y="204" width="110" height="16" rx="8" fill="#F5F7FA"/><rect x="658" y="232" width="84" height="10" rx="5" fill="#F5F7FA" fill-opacity=".4"/><rect x="658" y="262" width="70" height="28" rx="14" fill="#FFC400"/>
<rect x="790" y="200" width="84" height="94" rx="12" fill="#5C9DFF" fill-opacity=".85"/>
<path d="M832 214 l8 18 l20 2 l-15 13 l5 20 l-18 -11 l-18 11 l5 -20 l-15 -13 l20 -2Z" fill="#F5F7FA" transform="translate(0 6) scale(.9) translate(86 14)"/></g>

<g transform="translate(120 250) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(440 860) scale(0.55)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g><g transform="translate(830 640) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(300 300) scale(0.5)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(880 820) scale(0.45)" fill="#5C9DFF"><use href="#spark" class="tw"/></g><g transform="translate(520 150) scale(0.5)" fill="#FFE38A"><use href="#spark" class="tw2"/></g>
</svg>