<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Logo tile, color palette and a website: we bring it to life" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob2"><rect x="330" y="190" width="500" height="380" rx="34" fill="#141923" stroke="#F5F7FA" stroke-opacity=".25" stroke-width="3"/>
<path d="M330 224 a34 34 0 0 1 34 -34 H796 a34 34 0 0 1 34 34 V256 H330Z" fill="#2A3342"/><circle cx="372" cy="223" r="8" fill="#FF6B6B"/><circle cx="400" cy="223" r="8" fill="#FFC400"/><circle cx="428" cy="223" r="8" fill="#5BD08A"/>
<rect x="372" y="296" width="230" height="22" rx="11" fill="#F5F7FA"/><rect x="372" y="338" width="180" height="14" rx="7" fill="#F5F7FA" fill-opacity=".4"/><rect x="372" y="378" width="120" height="42" rx="21" fill="#FFC400"/>
<rect x="640" y="290" width="150" height="140" rx="18" fill="#5C9DFF" fill-opacity=".85"/><circle cx="715" cy="340" r="24" fill="#F5F7FA" fill-opacity=".9"/>
<rect x="372" y="460" width="130" height="70" rx="14" fill="#2A3342"/><rect x="522" y="460" width="130" height="70" rx="14" fill="#2A3342"/><rect x="672" y="460" width="130" height="70" rx="14" fill="#2A3342"/></g>
<g class="bob"><rect x="150" y="470" width="300" height="300" rx="52" fill="#141923" stroke="#F5F7FA" stroke-opacity=".35" stroke-width="4"/>
<path pathLength="1" d="M205 680 C 235 580, 265 500, 285 540 C 305 580, 235 690, 275 690 C 325 690, 335 570, 370 574 C 405 578, 350 672, 388 668 C 412 665, 420 620, 432 610" fill="none" stroke="url(#ink)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M205 725 C 290 700, 390 745, 430 715" fill="none" stroke="#5C9DFF" stroke-width="7" stroke-linecap="round"/></g>
<g class="bob2"><circle cx="560" cy="700" r="40" fill="#FFC400"/><circle cx="650" cy="700" r="40" fill="#5C9DFF"/><circle cx="740" cy="700" r="40" fill="#F5F7FA"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>