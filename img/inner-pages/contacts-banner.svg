<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" role="img" aria-label="Paper plane, chat bubbles, phone, envelope and location pin representing getting in touch with Autograph Creative Agency" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.1" cy="0.1" r="0.55"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.30"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.9" cy="0.95" r="0.55"><stop offset="0" stop-color="#FFC400" stop-opacity="0.24"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<radialGradient id="gc" cx="0.5" cy="0.5" r="0.4"><stop offset="0" stop-color="#FFC400" stop-opacity="0.12"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}.bob3{animation:bob 5.5s ease-in-out -4s infinite}.fly{animation:fly 5s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes fly{0%,100%{translate:0 0;rotate:0deg}50%{translate:14px -22px;rotate:-2deg}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.spin2{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{animation:dash 3s linear infinite}@keyframes dash{to{stroke-dashoffset:-60}}
.dot1,.dot2,.dot3{animation:blink 1.8s ease-in-out infinite}.dot2{animation-delay:.3s}.dot3{animation-delay:.6s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.bob3,.fly,.tw,.tw2,.spin,.spin2,.dash,.dot1,.dot2,.dot3{animation:none}}
</style>
<rect width="1920" height="960" fill="#0B0E14"/><rect width="1920" height="960" fill="url(#dots)"/>
<rect width="1920" height="960" fill="url(#gb)"/><rect width="1920" height="960" fill="url(#gg)"/><rect width="1920" height="960" fill="url(#gc)"/>
<g class="spin"><circle cx="960" cy="480" r="400" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="spin2"><circle cx="960" cy="480" r="320" fill="none" stroke="#5C9DFF" stroke-opacity=".32" stroke-width="2" stroke-dasharray="90 40 6 40"/></g>

<!-- center: paper plane with a dotted trail -->
<path class="dash" d="M560 800 C 640 560, 760 720, 830 560" fill="none" stroke="#FFC400" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 26" stroke-opacity=".8"/>
<g transform="translate(990 450) rotate(-12)"><g class="fly">
<path d="M-190 10 L200 -130 L70 160 L8 50Z" fill="#F5F7FA"/>
<path d="M-190 10 L200 -130 L8 50Z" fill="#FFE38A"/>
<path d="M8 50 L70 160 L-10 90Z" fill="#FFC400"/>
<path d="M-190 10 L200 -130 L70 160 L8 50Z" fill="none" stroke="#FFC400" stroke-width="5" stroke-linejoin="round"/>
<path d="M8 50 L200 -130" stroke="#0B0E14" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/></g></g>

<!-- left: phone + chat bubbles -->
<g class="bob2"><rect x="250" y="190" width="230" height="400" rx="40" fill="#0B0E14" stroke="#F5F7FA" stroke-width="6"/>
<rect x="340" y="212" width="50" height="10" rx="5" fill="#F5F7FA" fill-opacity=".25"/>
<rect x="284" y="260" width="140" height="48" rx="24" fill="#141923" stroke="#5C9DFF" stroke-width="3"/><rect x="304" y="278" width="80" height="10" rx="5" fill="#F5F7FA" fill-opacity=".6"/>
<rect x="306" y="332" width="140" height="48" rx="24" fill="#FFC400"/><rect x="326" y="350" width="80" height="10" rx="5" fill="#0B0E14" fill-opacity=".7"/>
<rect x="284" y="404" width="110" height="48" rx="24" fill="#141923" stroke="#5C9DFF" stroke-width="3"/><circle class="dot1" cx="318" cy="428" r="7" fill="#F5F7FA"/><circle class="dot2" cx="339" cy="428" r="7" fill="#F5F7FA"/><circle class="dot3" cx="360" cy="428" r="7" fill="#F5F7FA"/>
<rect x="284" y="510" width="162" height="44" rx="22" fill="#2A3342"/></g>
<g class="bob"><path d="M560 190 H700 a40 40 0 0 1 40 40 V300 a40 40 0 0 1 -40 40 H640 L600 380 V340 H560 a40 40 0 0 1 -40 -40 V230 a40 40 0 0 1 40 -40Z" fill="#141923" stroke="#5C9DFF" stroke-width="5"/>
<rect x="556" y="236" width="128" height="14" rx="7" fill="#F5F7FA" fill-opacity=".7"/><rect x="556" y="266" width="90" height="14" rx="7" fill="#F5F7FA" fill-opacity=".4"/></g>

<!-- right: envelope, pin, @ -->
<g class="bob3"><rect x="1320" y="170" width="320" height="210" rx="26" fill="#141923" stroke="#F5F7FA" stroke-opacity=".3" stroke-width="4"/>
<path d="M1328 186 L1480 300 L1632 186" fill="none" stroke="#F5F7FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1328 366 L1430 270 M1632 366 L1530 270" stroke="#2A3342" stroke-width="5" stroke-linecap="round"/>
<circle cx="1632" cy="178" r="30" fill="#FFC400"/><rect x="1626" y="160" width="12" height="22" rx="5" fill="#0B0E14"/><circle cx="1632" cy="194" r="6" fill="#0B0E14"/></g>
<g class="bob"><path d="M1520 540 C 1450 540, 1410 596, 1410 650 C 1410 730, 1520 830, 1520 830 C 1520 830, 1630 730, 1630 650 C 1630 596, 1590 540, 1520 540Z" fill="#FFC400"/><circle cx="1520" cy="650" r="42" fill="#0B0E14"/><circle cx="1520" cy="650" r="18" fill="#F5F7FA"/></g>
<g class="bob2"><circle cx="1260" cy="690" r="64" fill="#141923" stroke="#5C9DFF" stroke-width="5"/><text x="1260" y="716" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="600" fill="#F5F7FA">@</text></g>

<g transform="translate(780 120) scale(0.9)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(1120 830) scale(0.7)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g><g transform="translate(120 820) scale(0.6)" fill="#5C9DFF"><use href="#spark" class="tw"/></g><g transform="translate(1820 120) scale(0.55)" fill="#FFE38A"><use href="#spark" class="tw2"/></g><g transform="translate(640 860) scale(0.5)" fill="#FFE38A"><use href="#spark" class="tw2"/></g><g transform="translate(1210 110) scale(0.45)" fill="#5C9DFF"><use href="#spark" class="tw"/></g><g transform="translate(110 430) scale(0.5)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g><g transform="translate(1790 600) scale(0.6)" fill="#FFE38A"><use href="#spark" class="tw"/></g>
</svg>