<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Speech bubble with a lightbulb: tell us your idea" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="gb" cx="0.2" cy="0.15" r="0.65"><stop offset="0" stop-color="#5C9DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#5C9DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gg" cx="0.7" cy="0.8" r="0.6"><stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#F5F7FA" fill-opacity="0.12"/></pattern>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="0.55" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<path id="spark" d="M0 -26 C3 -8 8 -3 26 0 C8 3 3 8 0 26 C-3 8 -8 3 -26 0 C-8 -3 -3 -8 0 -26Z"/>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation:bob 7.5s ease-in-out -2.5s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.tw2{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out -1.4s infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.tw,.tw2,.spin{animation:none}}
</style>
<rect width="960" height="960" fill="#0B0E14"/><rect width="960" height="960" fill="url(#dots)"/>
<rect width="960" height="960" fill="url(#gb)"/><rect width="960" height="960" fill="url(#gg)"/>
<g class="spin"><circle cx="480" cy="480" r="380" fill="none" stroke="#F5F7FA" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/></g>
<g class="bob"><path d="M200 220 H640 a60 60 0 0 1 60 60 V500 a60 60 0 0 1 -60 60 H430 L320 660 V560 H200 a60 60 0 0 1 -60 -60 V280 a60 60 0 0 1 60 -60Z" fill="#141923" stroke="#5C9DFF" stroke-width="7"/>
<circle cx="420" cy="380" r="120" fill="#FFC400" fill-opacity=".16"/>
<path d="M420 300 a64 64 0 0 1 40 114 v28 h-80 v-28 a64 64 0 0 1 40 -114Z" fill="#FFC400"/>
<rect x="384" y="454" width="72" height="14" rx="7" fill="#F5F7FA"/><rect x="394" y="476" width="52" height="12" rx="6" fill="#F5F7FA" fill-opacity=".7"/>
<path d="M402 384 q18 -26 36 0 M420 360 v30" fill="none" stroke="#0B0E14" stroke-width="6" stroke-linecap="round" stroke-opacity=".5"/>
<g stroke="#FFE38A" stroke-width="7" stroke-linecap="round"><line x1="540" y1="300" x2="580" y2="270"/><line x1="560" y1="360" x2="610" y2="360"/><line x1="300" y1="300" x2="260" y2="270"/><line x1="280" y1="360" x2="230" y2="360"/></g></g>
<g class="bob2"><rect x="560" y="640" width="250" height="110" rx="55" fill="#FFC400"/><circle class="tw" cx="640" cy="695" r="12" fill="#0B0E14"/><circle class="tw2" cx="685" cy="695" r="12" fill="#0B0E14"/><circle class="tw" cx="730" cy="695" r="12" fill="#0B0E14"/></g><g transform="translate(180 190) scale(0.8)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(790 230) scale(0.55)" fill="#5C9DFF"><use href="#spark" class="tw2"/></g><g transform="translate(780 760) scale(0.7)" fill="#FFE38A"><use href="#spark" class="tw"/></g><g transform="translate(210 740) scale(0.45)" fill="#F5F7FA"><use href="#spark" class="tw2"/></g>
</svg>